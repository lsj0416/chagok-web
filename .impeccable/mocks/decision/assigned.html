<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#F3F5FA;font-family:"Gothic A1",sans-serif;color:#1E2A5A;word-break:keep-all;position:relative}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.date{font-family:Gaegu,cursive;font-size:28px;line-height:1}
.date small{font-family:"Gothic A1";font-size:15px;font-weight:600;color:#5A648C;margin-left:6px}
.gear{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.gear i{width:20px;height:20px;border:2px solid #1E2A5A;border-radius:50%}
.strip{margin:4px 16px 0;position:relative;padding:14px 12px 12px;background:#fff;border-radius:6px;box-shadow:0 1px 0 #DCE1EE}
.tape{position:absolute;top:-8px;left:50%;width:96px;height:18px;margin-left:-48px;background:#FFE15A;opacity:.85;transform:rotate(-2deg)}
.bld{display:flex;gap:10px}
.b{flex:1}
.ph{aspect-ratio:1;background:#D6D6D6;border-radius:6px;display:grid;place-items:center;font-size:12px;color:#4B4B4B;font-weight:600;position:relative}
.ph:after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;border-radius:0 0 3px 3px}
.b1 .ph:after{background:#7FCBB6}.b2 .ph:after{background:#FF8B7B}.b3 .ph:after{background:#8FA8F0}
.bn{margin-top:9px;font-size:13px;font-weight:600}
.bs{font-size:12px;color:#5A648C}
.sum{margin:20px 20px 0;font-size:15px;color:#3A4573}
.sum b{font-weight:800;color:#1E2A5A}
h2{margin:22px 20px 4px;font-size:13px;font-weight:800;letter-spacing:.02em;color:#5A648C;display:flex;align-items:center;gap:8px}
h2 .hl{background:linear-gradient(transparent 55%,#FFE15A 55%);color:#1E2A5A;padding:0 2px}
.row{display:flex;align-items:flex-start;gap:4px;padding:3px 8px 3px 8px}
.ck{width:44px;height:44px;display:grid;place-items:center;flex:none}
.ck i{width:24px;height:24px;border:2px solid #9AA3C4;border-radius:50%;background:#fff}
.ck.done i{border:0;background:#FF8B7B;border-radius:50%;box-shadow:0 0 0 3px #fff,0 1px 3px 3px rgba(30,42,90,.18);transform:rotate(-8deg);display:grid;place-items:center}
.ck.done i:before{content:"";width:9px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.t{flex:1;padding-top:11px;min-width:0}
.tt{font-size:17px;line-height:1.35}
.done .tt,.row.done .tt{color:#8A92B2;text-decoration:line-through;text-decoration-color:#B8BED6}
.cap{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:13px;color:#5A648C}
.cap i{width:14px;height:7px;border-radius:1px;transform:rotate(-4deg)}
.c1{background:#7FCBB6}.c2{background:#FF8B7B}.c3{background:#8FA8F0}
.core .tt{background:linear-gradient(transparent 62%,rgba(255,225,90,.75) 62%);display:inline}
.more{width:44px;height:44px;flex:none;display:grid;place-items:center;color:#9AA3C4;font-weight:800}
.bonus{margin:16px 20px 0;padding:11px 0;border-top:1px dashed #C6CCE0;border-bottom:1px dashed #C6CCE0;display:flex;justify-content:space-between;font-size:15px;color:#3A4573}
.bonus b{font-weight:800}
.add{position:absolute;left:16px;right:16px;bottom:78px;height:52px;border-radius:12px;background:#1E2A5A;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 -14px 16px 6px #F3F5FA}
.tabs{position:absolute;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid #DCE1EE;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:#8A92B2}
.tab i{width:22px;height:22px;border:1.8px solid #8A92B2;border-radius:6px}
.tab.on{color:#1E2A5A;font-weight:800}.tab.on i{border-color:#1E2A5A;border-width:2.2px;background:#FFE15A}
</style></head><body>
<div class="top"><div class="date">10월 28일<small>수요일</small></div><div class="gear"><i></i></div></div>
<div class="strip"><span class="tape"></span>
 <div class="bld">
  <div class="b b1"><div class="ph">오피스</div><p class="bn">오피스</p><p class="bs">골조</p></div>
  <div class="b b2"><div class="ph">학교</div><p class="bn">학교</p><p class="bs">터</p></div>
  <div class="b b3"><div class="ph">체육관</div><p class="bn">체육관</p><p class="bs">터</p></div>
 </div>
</div>
<p class="sum">핵심 할 일 <b>1/3</b> · 오늘 <b>2개</b> 완료했어요</p>
<h2><span class="hl">핵심 할 일</span></h2>
<div class="row done"><div class="ck done"><i></i></div><div class="t"><p class="tt">관심 공고 3개에서 주요 업무 정리하기</p><p class="cap"><i class="c1"></i>백엔드 개발자로 취업하기</p></div><div class="more"></div></div>
<div class="row core"><div class="ck"><i></i></div><div class="t"><p class="tt">지원동기 첫 문단 쓰기</p><p class="cap"><i class="c1"></i>백엔드 개발자로 취업하기</p></div><div class="more">···</div></div>
<div class="row core"><div class="ck"><i></i></div><div class="t"><p class="tt">기출 1회분 풀기</p><p class="cap"><i class="c2"></i>정보처리기사 필기 합격</p></div><div class="more">···</div></div>
<h2>할 일</h2>
<div class="row"><div class="ck"><i></i></div><div class="t"><p class="tt">Spring Security 강의 1개 듣기</p><p class="cap"><i class="c1"></i>백엔드 개발자로 취업하기</p></div><div class="more">···</div></div>
<div class="row"><div class="ck"><i></i></div><div class="t"><p class="tt">산책 30분</p><p class="cap"><i class="c3"></i>주 3회 운동하기</p></div><div class="more">···</div></div>
<div class="add">＋ 할 일 추가</div>
<nav class="tabs"><div class="tab on"><i></i>오늘</div><div class="tab"><i></i>마을</div><div class="tab"><i></i>목표</div><div class="tab"><i></i>기록</div></nav>
</body></html>
