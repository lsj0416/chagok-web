openapi: 3.1.0
info:
  title: chagok API
  version: 0.1.0
  description: |
    차곡(코드네임) 백엔드 API 명세. 프론트엔드의 가짜 서버(src/mocks/server.ts)와 타입(src/types/index.ts)을 기준으로 썼다.
    규칙과 흐름 설명은 docs/api.md, 용어는 docs/glossary.md를 따른다.
    가짜 서버의 조회 결과가 이 명세의 스키마와 맞는지는 src/mocks/openapi.test.ts가 검사한다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: auth
    description: 로그인, 토큰 갱신, 로그아웃 (S01)
  - name: today
    description: 오늘 화면 (S02)
  - name: tasks
    description: 할 일 (S02, S03, S04, S16)
  - name: goals
    description: 목표 (S08, S09~S12)
  - name: ai
    description: AI 목표 분해 (S09, S10)
  - name: records
    description: 기록, 업적 (S13, S14)
  - name: village
    description: 마을과 건물 (S05)
  - name: house
    description: 집과 가구 (S06, S07)
  - name: settings
    description: 설정과 알림 구독 (S15)

paths:
  # 인증
  /auth/google:
    post:
      tags: [auth]
      operationId: signInWithGoogle
      summary: 구글 ID 토큰으로 로그인
      description: |
        Google Identity Services가 준 ID 토큰을 검증하고 사용자를 만들거나 찾는다.
        액세스 토큰은 본문으로, 리프레시 토큰은 httpOnly 쿠키(`chagok_refresh`)로 준다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleSignInRequest" }
      responses:
        "200":
          description: 로그인 성공
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshAccessToken
      summary: 리프레시 쿠키로 액세스 토큰 다시 받기
      description: 리프레시 토큰은 쓸 때마다 새로 바꾼다(회전). 이미 쓴 토큰이 다시 오면 그 계열을 모두 무효로 한다.
      security: []
      parameters:
        - { $ref: "#/components/parameters/RefreshCookie" }
      responses:
        "200":
          description: 새 액세스 토큰
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: signOut
      summary: 로그아웃
      description: 리프레시 토큰을 무효로 하고 쿠키를 지운다. 이 기기의 알림 구독은 남긴다.
      security: []
      parameters:
        - { $ref: "#/components/parameters/RefreshCookie" }
      responses:
        "204": { description: 로그아웃됨 }

  # 오늘
  /today:
    get:
      tags: [today]
      operationId: fetchTodayPlan
      summary: 오늘 화면에 필요한 값
      description: "'오늘'은 사용자 설정 시간대의 자정을 기준으로 서버가 정한다."
      responses:
        "200":
          description: 오늘 계획
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TodayPlan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tasks/overdue:
    get:
      tags: [today]
      operationId: fetchOverdueTasks
      summary: 지난 할 일 목록 (지난 할 일 바텀시트)
      responses:
        "200":
          description: 수행 날짜가 지났고 완료하지 않은 할 일
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskListResult" }
  /days/{date}/core-tasks:
    get:
      tags: [tasks]
      operationId: fetchDayCoreTasks
      summary: 그날의 핵심 할 일
      description: 핵심 할 일을 그날로 옮기거나 더하기 전에 자리가 있는지 본다. 가득 찼으면 화면이 핵심 교체 시트를 연다.
      parameters:
        - name: date
          in: path
          required: true
          schema: { $ref: "#/components/schemas/DateKey" }
        - name: excludeTaskId
          in: query
          required: false
          description: 옮기려는 할 일 자신은 빼고 센다
          schema: { type: string }
      responses:
        "200":
          description: 그날 핵심 할 일 (나눠진 할 일 제외)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }

  # 할 일
  /tasks:
    post:
      tags: [tasks]
      operationId: createTask
      summary: 할 일 만들기 (S03 할 일 추가, S16 빠른 추가)
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: 만든 할 일
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/CoreFull" }
  /tasks/{taskId}:
    parameters:
      - { $ref: "#/components/parameters/TaskId" }
    get:
      tags: [tasks]
      operationId: fetchTaskDetail
      summary: 할 일 상세 (S04)
      responses:
        "200":
          description: 할 일 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tasks]
      operationId: updateTask
      summary: 제목, 메모, 연결 목표, 반복 고치기
      description: 날짜는 PUT /tasks/{taskId}/schedule, 핵심 지정은 PUT /tasks/{taskId}/core로 바꾼다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskRequest" }
      responses:
        "200":
          description: 고친 할 일
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: 할 일 지우기
      description: 완료한 할 일을 지워도 받은 크레딧과 공사 진행은 회수하지 않는다.
      responses:
        "204": { description: 지움 }
        "404": { $ref: "#/components/responses/NotFound" }
  /tasks/{taskId}/complete:
    post:
      tags: [tasks]
      operationId: completeTask
      summary: 완료
      description: |
        크레딧, 일일 보너스, 공사 진행을 반영한다. 같은 멱등성 키로 다시 오면 처음 결과를 그대로 준다.
        이미 완료한 할 일이면 아무것도 지급하지 않고 지금 상태를 준다.
      parameters:
        - { $ref: "#/components/parameters/TaskId" }
        - { $ref: "#/components/parameters/IdempotencyKeyRequired" }
      responses:
        "200":
          description: 완료 결과. 화면은 이 값으로 완료 알림 문구를 만든다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompletionResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /tasks/{taskId}/uncomplete:
    post:
      tags: [tasks]
      operationId: uncompleteTask
      summary: 완료 취소 (완료한 당일만)
      description: 크레딧과 공사 진행을 회수한다. 일반 할 일 완료 수가 기준 아래로 내려가면 일일 보너스도 회수한다. 잔액은 음수가 될 수 있다.
      parameters:
        - { $ref: "#/components/parameters/TaskId" }
        - { $ref: "#/components/parameters/IdempotencyKeyRequired" }
      responses:
        "200":
          description: 완료를 취소한 할 일
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /tasks/{taskId}/core:
    put:
      tags: [tasks]
      operationId: setTaskCore
      summary: 핵심으로 지정하거나 해제
      description: |
        그날 핵심이 가득 찼는데 지정하려면 coreConflict.replaceCoreTaskId로 뺄 할 일을 함께 보낸다(핵심 교체).
        없으면 409 CORE_FULL로 거절한다. 날짜 없는 할 일은 핵심이 될 수 없다.
      parameters:
        - { $ref: "#/components/parameters/TaskId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetCoreRequest" }
      responses:
        "200":
          description: 바뀐 할 일
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CoreFull" }
  /tasks/{taskId}/schedule:
    put:
      tags: [tasks]
      operationId: scheduleTask
      summary: 날짜 바꾸기 또는 날짜 없이 보관
      description: |
        date가 null이면 날짜 없이 보관(핵심도 해제). 매일 반복하는 할 일은 날짜 없이 둘 수 없다(409 RECURRING_NEEDS_DATE).
        핵심 할 일을 핵심이 가득 찬 날로 옮기면 coreConflict가 있어야 하고, 없으면 409 CORE_FULL로 거절한다.
        이전 날짜의 계획 이력은 남아 그날 기록의 '옮긴 일'이 된다.
      parameters:
        - { $ref: "#/components/parameters/TaskId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleTaskRequest" }
      responses:
        "200":
          description: 바뀐 할 일
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CoreFull" }
  /tasks/{taskId}/split:
    post:
      tags: [tasks]
      operationId: splitTask
      summary: 나누기
      description: 원래 할 일은 SPLIT 상태로 남는다. 새 할 일은 날짜와 목표를 이어받고, 일반 할 일이며 반복과 메모는 물려받지 않는다.
      parameters:
        - { $ref: "#/components/parameters/TaskId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SplitTaskRequest" }
      responses:
        "201":
          description: 새로 만든 할 일
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  # 목표
  /goals:
    get:
      tags: [goals]
      operationId: fetchGoals
      summary: 목표 목록 (S08). 최근에 만든 목표가 위
      parameters:
        - name: status
          in: query
          required: false
          description: 없으면 모든 상태. 첫 진입 판단(진행 중 목표 수)은 status=ACTIVE로 센다
          schema: { $ref: "#/components/schemas/GoalStatus" }
      responses:
        "200":
          description: 목표 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GoalSummary" }
    post:
      tags: [goals]
      operationId: createGoal
      summary: 목표 만들기 (S10 N개 추가하기, S11 목표 만들기)
      description: 목표, 날짜 없는 할 일, 건물 터를 한 번에 만든다.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGoalRequest" }
      responses:
        "201":
          description: 만든 목표
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /goals/{goalId}:
    parameters:
      - { $ref: "#/components/parameters/GoalId" }
    get:
      tags: [goals]
      operationId: fetchGoalDetail
      summary: 목표 상세 (S12)
      responses:
        "200":
          description: 목표 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [goals]
      operationId: updateGoal
      summary: 목표 고치기 (제목, 기한, 완료 조건)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGoalRequest" }
      responses:
        "200":
          description: 고친 목표
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /goals/{goalId}/complete:
    post:
      tags: [goals]
      operationId: completeGoal
      summary: 목표 완료 (사용자가 확인할 때만)
      description: 건물이 완성된다. 남은 할 일은 사용자가 고른 대로 처리한다. 서비스가 목표를 자동으로 완료하지 않는다.
      parameters:
        - { $ref: "#/components/parameters/GoalId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteGoalRequest" }
      responses:
        "200":
          description: 완료한 목표
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /goals/{goalId}/archive:
    post:
      tags: [goals]
      operationId: archiveGoal
      summary: 보관 (공사 중지)
      parameters:
        - { $ref: "#/components/parameters/GoalId" }
      responses:
        "200":
          description: 보관한 목표
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /goals/{goalId}/resume:
    post:
      tags: [goals]
      operationId: resumeGoal
      summary: 다시 진행
      parameters:
        - { $ref: "#/components/parameters/GoalId" }
      responses:
        "200":
          description: 다시 진행하는 목표
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /goals/{goalId}/tasks:
    post:
      tags: [goals]
      operationId: addGoalTasks
      summary: 진행 중 목표에 할 일 더하기 (S12의 AI로 할 일 추가)
      parameters:
        - { $ref: "#/components/parameters/GoalId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddGoalTasksRequest" }
      responses:
        "201":
          description: 더한 할 일 (모두 날짜 없음)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # AI
  /ai/usage:
    get:
      tags: [ai]
      operationId: fetchAiUsage
      summary: 오늘 AI 사용 횟수와 남은 횟수
      responses:
        "200":
          description: 사용량
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiUsage" }
  /ai/goal-breakdowns:
    post:
      tags: [ai]
      operationId: requestGoalBreakdown
      summary: 목표를 할 일 초안으로 나누기
      description: |
        LLM을 호출한 요청은 하루 사용 횟수에 1회로 센다. 사용자가 응답 전에 취소해도 센다.
        LLM 오류와 서버 쪽 시간 초과는 세지 않는다. 초안은 저장하지 않고, 분해 요청(입력, 제안, 모델)만 기록한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalBreakdownRequest" }
      responses:
        "200":
          description: 추천 목표 유형과 초안
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalBreakdown" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/AiDailyLimit" }
        "502": { $ref: "#/components/responses/AiUnavailable" }
        "504": { $ref: "#/components/responses/AiUnavailable" }

  # 기록, 업적
  /records:
    get:
      tags: [records]
      operationId: fetchRecords
      summary: 주간 요약과 최근 30일의 날짜별 기록 (S13)
      responses:
        "200":
          description: 기록 첫 화면
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordsOverview" }
  /records/days:
    get:
      tags: [records]
      operationId: fetchDayRecords
      summary: 이전 기록 더 보기
      parameters:
        - name: before
          in: query
          required: true
          description: 이 날짜 바로 전날부터 30일. 앞 응답의 olderBefore를 그대로 보낸다
          schema: { $ref: "#/components/schemas/DateKey" }
      responses:
        "200":
          description: 날짜별 기록 한 묶음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayRecordPage" }
  /achievements:
    get:
      tags: [records]
      operationId: fetchAchievements
      summary: 업적 목록과 진행 (S14)
      responses:
        "200":
          description: 업적
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AchievementProgress" }

  # 마을
  /village:
    get:
      tags: [village]
      operationId: fetchVillageDetail
      summary: 마을 화면 (S05)
      responses:
        "200":
          description: 집, 건물, 건물에 연결된 목표, 크레딧 잔액
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VillageDetail" }
  /buildings/{buildingId}/stage-seen:
    post:
      tags: [village]
      operationId: markBuildingStageSeen
      summary: 오른 단계를 봤다고 기록 (다음 진입부터 연출하지 않음)
      parameters:
        - name: buildingId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: 기록함 }
        "404": { $ref: "#/components/responses/NotFound" }

  # 집
  /house:
    get:
      tags: [house]
      operationId: fetchHouseDetail
      summary: 집 내부 화면 (S06)
      responses:
        "200":
          description: 집, 슬롯, 설치, 보유 가구, 판매 가구, 잔액
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseDetail" }
  /house/upgrade:
    post:
      tags: [house]
      operationId: upgradeHouse
      summary: 집 넓히기
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyRequired" }
      responses:
        "200":
          description: 넓힌 집
          content:
            application/json:
              schema: { $ref: "#/components/schemas/House" }
        "409": { $ref: "#/components/responses/Conflict" }
  /house/furniture-purchases:
    post:
      tags: [house]
      operationId: purchaseAndPlace
      summary: 가구를 사서 슬롯에 놓기 (S07)
      description: 잔액이 가격보다 적거나 음수면 409 NOT_ENOUGH_CREDIT. 슬롯에 놓인 가구가 있으면 빼서 보유 상태로 둔다.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyRequired" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseFurnitureRequest" }
      responses:
        "201":
          description: 산 가구와 설치
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /house/slots/{slotId}/placement:
    parameters:
      - name: slotId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [house]
      operationId: placeOwnedFurniture
      summary: 보유한 가구를 슬롯에 놓기 (크레딧 차감 없음)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceFurnitureRequest" }
      responses:
        "200":
          description: 바뀐 집
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [house]
      operationId: removePlacement
      summary: 가구 빼기 (보유 가구로 남는다)
      responses:
        "204": { description: 뺌 }
        "404": { $ref: "#/components/responses/NotFound" }

  # 설정
  /me/settings:
    get:
      tags: [settings]
      operationId: fetchSettings
      summary: 설정 (S15)
      responses:
        "200":
          description: 설정
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSettings" }
    patch:
      tags: [settings]
      operationId: updateSettings
      summary: 설정 바꾸기 (바꾸는 즉시 저장)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSettingsRequest" }
      responses:
        "200":
          description: 바뀐 설정
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /me/push-subscriptions:
    post:
      tags: [settings]
      operationId: subscribePush
      summary: 이 기기의 웹 푸시 구독 등록 (알림을 켤 때)
      description: 같은 endpoint가 다시 오면 키만 바꾼다. PWA 단계에서 프론트와 연결한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscriptionRequest" }
      responses:
        "204": { description: 등록함 }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [settings]
      operationId: unsubscribePush
      summary: 이 기기의 웹 푸시 구독 지우기
      parameters:
        - name: endpoint
          in: query
          required: true
          schema: { type: string, format: uri }
      responses:
        "204": { description: 지움 }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 액세스 토큰. 15분. 메모리에만 둔다

  headers:
    RefreshCookie:
      description: '`chagok_refresh=<토큰>; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth; Max-Age=1209600` (14일)'
      schema: { type: string }

  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
    GoalId:
      name: goalId
      in: path
      required: true
      schema: { type: string }
    RefreshCookie:
      name: chagok_refresh
      in: cookie
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 화면이 요청마다 만든 UUID. 같은 키의 요청은 24시간 동안 한 번만 처리하고 같은 응답을 준다
      schema: { type: string, format: uuid }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: 크레딧이 움직이는 요청이라 반드시 보낸다. 같은 키의 요청은 24시간 동안 한 번만 처리하고 같은 응답을 준다
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: 입력값 오류 (VALIDATION_FAILED)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: 로그인이 필요하거나 토큰이 만료됨 (UNAUTHENTICATED)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: 없거나 다른 사용자의 것 (NOT_FOUND). 다른 사용자의 데이터는 403 대신 404로 답한다
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: 지금 상태에서 할 수 없음. code로 이유를 구분한다
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    CoreFull:
      description: 그날 핵심 할 일이 가득 참 (CORE_FULL) 또는 그 밖의 상태 충돌
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/CoreFullProblem" }
    AiDailyLimit:
      description: 오늘 AI 사용을 모두 씀 (AI_DAILY_LIMIT)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AiUnavailable:
      description: AI 응답 실패 또는 시간 초과 (AI_UNAVAILABLE, AI_TIMEOUT). 사용 횟수에 세지 않는다
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    # 공통
    DateKey:
      type: string
      format: date
      description: "'YYYY-MM-DD'. 사용자 시간대 기준 날짜"
    IsoDateTime:
      type: string
      format: date-time
      description: ISO 8601 시각 (UTC, 예 2026-10-28T09:00:00Z)
    Problem:
      type: object
      description: RFC 9457 Problem Details (Spring ProblemDetail)
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: 화면이 분기하는 오류 코드. docs/api.md 오류 코드 표 참고
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - NOT_FOUND
            - CORE_FULL
            - CORE_REPLACE_TARGET_INVALID
            - CANNOT_UNCOMPLETE
            - TASK_NOT_PLANNED
            - DONE_TASK_GOAL_LOCKED
            - RECURRENCE_NEEDS_DATE
            - RECURRING_NEEDS_DATE
            - GOAL_NOT_ACTIVE
            - NOT_ENOUGH_CREDIT
            - HOUSE_UPGRADE_NOT_READY
            - AI_DAILY_LIMIT
            - AI_UNAVAILABLE
            - AI_TIMEOUT
            - VERSION_CONFLICT
            - IDEMPOTENCY_KEY_REUSED
    CoreFullProblem:
      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          properties:
            coreTasks:
              type: array
              description: code가 CORE_FULL일 때 그날의 핵심 할 일. 화면이 핵심 교체 시트에 바로 쓴다
              items: { $ref: "#/components/schemas/Task" }

    # 인증
    GoogleSignInRequest:
      type: object
      additionalProperties: false
      required: [idToken, timezone]
      properties:
        idToken: { type: string, description: Google Identity Services가 준 ID 토큰(credential) }
        timezone: { type: string, description: 처음 가입할 때 기기 시간대(IANA). 이미 있는 사용자면 무시 }
    AccessToken:
      type: object
      additionalProperties: false
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: 초 단위 남은 시간 }
    SignInResponse:
      type: object
      additionalProperties: false
      required: [accessToken, expiresIn, activeGoalCount]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: 초 단위 남은 시간 }
        activeGoalCount: { type: integer, description: "0이면 S09(목표 입력), 아니면 S02로 보낸다" }

    # 목표와 할 일
    GoalType:
      type: string
      enum: [CAREER, STUDY, FINANCE, HEALTH, PROJECT]
    GoalStatus:
      type: string
      enum: [ACTIVE, COMPLETED, ARCHIVED]
    Goal:
      type: object
      additionalProperties: false
      required: [id, title, type, status, dueDate, completionCriteria, createdAt]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 100 }
        type: { $ref: "#/components/schemas/GoalType" }
        status: { $ref: "#/components/schemas/GoalStatus" }
        dueDate:
          oneOf: [{ $ref: "#/components/schemas/DateKey" }, { type: "null" }]
        completionCriteria: { type: [string, "null"], maxLength: 100 }
        createdAt: { $ref: "#/components/schemas/IsoDateTime" }
    TaskStatus:
      type: string
      enum: [PLANNED, DONE, SPLIT]
    TaskSource:
      type: string
      enum: [MANUAL, AI, TEMPLATE]
    TaskRecurrence:
      type: string
      enum: [DAILY]
    Task:
      type: object
      additionalProperties: false
      required: [id, title, goalId, status, scheduledDate, isCore, source, recurrence, memo, completedAt, createdAt]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 100 }
        goalId: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TaskStatus" }
        scheduledDate:
          description: null이면 날짜 없는 할 일
          oneOf: [{ $ref: "#/components/schemas/DateKey" }, { type: "null" }]
        isCore: { type: boolean }
        source: { $ref: "#/components/schemas/TaskSource" }
        recurrence:
          oneOf: [{ $ref: "#/components/schemas/TaskRecurrence" }, { type: "null" }]
        memo: { type: [string, "null"], maxLength: 500 }
        completedAt:
          oneOf: [{ $ref: "#/components/schemas/IsoDateTime" }, { type: "null" }]
        createdAt: { $ref: "#/components/schemas/IsoDateTime" }
    CoreConflictChoice:
      description: 핵심이 가득 찬 날로 핵심 할 일을 옮기거나 더할 때 사용자가 고른 처리
      oneOf:
        - type: object
          additionalProperties: false
          required: [replaceCoreTaskId]
          properties:
            replaceCoreTaskId: { type: string, description: 핵심에서 뺄 그날의 할 일. 완료한 할 일은 뺄 수 없다 }
        - type: object
          additionalProperties: false
          required: [asNormal]
          properties:
            asNormal: { const: true, description: 핵심 대신 일반 할 일로 둔다 }
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [title, scheduledDate, goalId, isCore, source, recurrence]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        scheduledDate:
          oneOf: [{ $ref: "#/components/schemas/DateKey" }, { type: "null" }]
        goalId: { type: [string, "null"], description: 진행 중 목표만 }
        isCore: { type: boolean, description: scheduledDate가 null이면 false여야 한다 }
        source: { $ref: "#/components/schemas/TaskSource" }
        recurrence:
          description: DAILY는 scheduledDate가 있어야 한다
          oneOf: [{ $ref: "#/components/schemas/TaskRecurrence" }, { type: "null" }]
        coreConflict: { $ref: "#/components/schemas/CoreConflictChoice" }
    UpdateTaskRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 보낸 값만 바꾼다
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        memo: { type: [string, "null"], maxLength: 500 }
        goalId: { type: [string, "null"], description: 완료한 할 일은 바꿀 수 없다(DONE_TASK_GOAL_LOCKED) }
        recurrence:
          description: DAILY는 날짜가 있는 할 일만(RECURRENCE_NEEDS_DATE)
          oneOf: [{ $ref: "#/components/schemas/TaskRecurrence" }, { type: "null" }]
    SetCoreRequest:
      type: object
      additionalProperties: false
      required: [isCore]
      properties:
        isCore: { type: boolean }
        coreConflict: { $ref: "#/components/schemas/CoreConflictChoice" }
    ScheduleTaskRequest:
      type: object
      additionalProperties: false
      required: [date]
      properties:
        date:
          description: null이면 날짜 없이 보관
          oneOf: [{ $ref: "#/components/schemas/DateKey" }, { type: "null" }]
        coreConflict: { $ref: "#/components/schemas/CoreConflictChoice" }
    SplitTaskRequest:
      type: object
      additionalProperties: false
      required: [titles]
      properties:
        titles:
          type: array
          minItems: 2
          items: { type: string, minLength: 1, maxLength: 100 }
    CreditChange:
      type: object
      additionalProperties: false
      required: [type, amount]
      properties:
        type: { $ref: "#/components/schemas/LedgerType" }
        amount: { type: integer }
    CompletionResult:
      type: object
      additionalProperties: false
      description: 완료 결과. 화면은 docs/screens.md 'S02 완료 알림 문구 규칙'대로 알림 문구를 만든다
      required: [task, credits, building, reachedFrame, dailyBonusEarnedNow, normalDoneToday, balance]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        credits:
          type: array
          description: 이번 완료로 지급된 크레딧 (핵심 할 일, 일일 보너스). 없으면 빈 배열
          items: { $ref: "#/components/schemas/CreditChange" }
        building:
          description: 공사가 진행된 건물 (완료 뒤 상태). 목표가 없거나 진행 중이 아니면 null
          oneOf: [{ $ref: "#/components/schemas/Building" }, { type: "null" }]
        reachedFrame: { type: boolean, description: 이번 완료로 골조 단계가 됐는지 }
        dailyBonusEarnedNow: { type: boolean }
        normalDoneToday: { type: integer, description: 이 완료를 포함한 오늘 완료한 일반 할 일 수 ('오늘의 보너스 3/5') }
        balance: { type: integer, description: 완료 뒤 크레딧 잔액 }
    TaskUnit:
      type: string
      enum: [MINUTE, COUNT, PAGE, ITEM]
    QuickTaskTemplate:
      type: object
      additionalProperties: false
      required: [id, keyword, units, amountOptions, defaultAmount, goalType, sortOrder]
      properties:
        id: { type: string }
        keyword: { type: string }
        units:
          type: array
          description: 쓸 수 있는 단위. 첫 번째가 기본 단위
          items: { $ref: "#/components/schemas/TaskUnit" }
        amountOptions:
          type: object
          description: 단위별 수량 선택지
          propertyNames: { $ref: "#/components/schemas/TaskUnit" }
          additionalProperties:
            type: array
            items: { type: integer }
        defaultAmount:
          type: object
          description: 단위별 기본 수량
          propertyNames: { $ref: "#/components/schemas/TaskUnit" }
          additionalProperties: { type: integer }
        goalType:
          oneOf: [{ $ref: "#/components/schemas/GoalType" }, { type: "null" }]
        sortOrder: { type: integer }
    TaskListResult:
      type: object
      additionalProperties: false
      required: [tasks, goals]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        goals:
          type: array
          description: 할 일에 연결된 목표
          items: { $ref: "#/components/schemas/Goal" }
    TaskDetail:
      type: object
      additionalProperties: false
      required: [task, goals, dayCoreTasks]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        goals:
          type: array
          description: 연결할 수 있는 진행 중 목표. 지금 연결된 목표가 보관·완료 상태여도 함께 준다
          items: { $ref: "#/components/schemas/Goal" }
        dayCoreTasks:
          type: array
          description: 같은 날짜의 다른 핵심 할 일. 날짜 없는 할 일이면 빈 배열
          items: { $ref: "#/components/schemas/Task" }
    TodayPlan:
      type: object
      additionalProperties: false
      required: [date, tasks, goals, buildings, overdueCount, canUpgradeHouse, undatedTasks, quickTemplates, dailyBonusEarned]
      properties:
        date: { $ref: "#/components/schemas/DateKey" }
        tasks:
          type: array
          description: 수행 날짜가 오늘인 할 일 (SPLIT 제외)
          items: { $ref: "#/components/schemas/Task" }
        goals:
          type: array
          description: 할 일에 연결된 목표와 진행 중 목표
          items: { $ref: "#/components/schemas/Goal" }
        buildings:
          type: array
          items: { $ref: "#/components/schemas/Building" }
        overdueCount: { type: integer }
        canUpgradeHouse: { type: boolean }
        undatedTasks:
          type: array
          description: 진행 중 목표의 날짜 없는 할 일 (빈 화면 카드)
          items: { $ref: "#/components/schemas/Task" }
        quickTemplates:
          type: array
          description: 정렬된 빠른 추가 템플릿
          items: { $ref: "#/components/schemas/QuickTaskTemplate" }
        dailyBonusEarned: { type: boolean }

    # 목표 조회와 요청
    GoalSummary:
      type: object
      additionalProperties: false
      required: [goal, building, doneTaskCount, taskCount]
      properties:
        goal: { $ref: "#/components/schemas/Goal" }
        building:
          oneOf: [{ $ref: "#/components/schemas/Building" }, { type: "null" }]
        doneTaskCount: { type: integer }
        taskCount: { type: integer, description: 연결된 할 일 수 (나눠진 할 일 제외) }
    GoalDetail:
      type: object
      additionalProperties: false
      required: [goal, building, tasks, activeGoals, todayTasks]
      properties:
        goal: { $ref: "#/components/schemas/Goal" }
        building:
          oneOf: [{ $ref: "#/components/schemas/Building" }, { type: "null" }]
        tasks:
          type: array
          description: 이 목표에 연결된 할 일 (나눠진 할 일 제외)
          items: { $ref: "#/components/schemas/Task" }
        activeGoals:
          type: array
          description: 할 일 추가에서 고를 수 있는 진행 중 목표
          items: { $ref: "#/components/schemas/Goal" }
        todayTasks:
          type: array
          description: 오늘 할 일. 할 일 추가의 핵심 3개 확인과 완료 알림 계산에 쓴다
          items: { $ref: "#/components/schemas/Task" }
    CreateGoalRequest:
      type: object
      additionalProperties: false
      required: [title, type, dueDate, taskTitles, source, breakdownId]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        type: { $ref: "#/components/schemas/GoalType" }
        dueDate:
          oneOf: [{ $ref: "#/components/schemas/DateKey" }, { type: "null" }]
        taskTitles:
          type: array
          description: 만들 할 일 제목. 모두 날짜 없는 할 일이 된다
          items: { type: string, minLength: 1, maxLength: 100 }
        source: { $ref: "#/components/schemas/TaskSource" }
        breakdownId: { type: [string, "null"], description: AI 초안에서 골랐으면 그 분해 요청의 ID. 채택률을 센다 }
    UpdateGoalRequest:
      type: object
      additionalProperties: false
      required: [title, dueDate, completionCriteria]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        dueDate:
          description: 새로 고르는 기한은 오늘부터. 지난 기한을 그대로 두는 것은 된다
          oneOf: [{ $ref: "#/components/schemas/DateKey" }, { type: "null" }]
        completionCriteria: { type: [string, "null"], maxLength: 100 }
    RemainingTaskAction:
      type: string
      description: '남은 할 일 처리: 그대로 두기 / 날짜 없이 보관 / 삭제'
      enum: [KEEP, UNSCHEDULE, DELETE]
    CompleteGoalRequest:
      type: object
      additionalProperties: false
      required: [remainingTasks]
      properties:
        remainingTasks: { $ref: "#/components/schemas/RemainingTaskAction" }
    AddGoalTasksRequest:
      type: object
      additionalProperties: false
      required: [titles, source, breakdownId]
      properties:
        titles:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 100 }
        source: { $ref: "#/components/schemas/TaskSource" }
        breakdownId: { type: [string, "null"] }

    # AI
    GoalBreakdownRequest:
      type: object
      additionalProperties: false
      required: [title, dueDate, currentSituation]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        dueDate:
          oneOf: [{ $ref: "#/components/schemas/DateKey" }, { type: "null" }]
        currentSituation: { type: [string, "null"], maxLength: 200 }
    TaskDraft:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: { type: string, description: 이 응답 안에서만 쓰는 초안 ID }
        title: { type: string }
    GoalBreakdown:
      type: object
      additionalProperties: false
      required: [breakdownId, goalType, drafts]
      properties:
        breakdownId: { type: string }
        goalType: { $ref: "#/components/schemas/GoalType" }
        drafts:
          type: array
          minItems: 5
          maxItems: 10
          items: { $ref: "#/components/schemas/TaskDraft" }
    AiUsage:
      type: object
      additionalProperties: false
      required: [usedToday, remaining]
      properties:
        usedToday: { type: integer }
        remaining: { type: integer }

    # 기록, 업적
    RecordTask:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
    MovedTask:
      type: object
      additionalProperties: false
      required: [id, title, movedTo]
      properties:
        id: { type: string }
        title: { type: string }
        movedTo:
          description: null이면 날짜 없이 보관
          oneOf: [{ $ref: "#/components/schemas/DateKey" }, { type: "null" }]
    DayRecord:
      type: object
      additionalProperties: false
      description: 계획 이력과 실행 이력에서 계산한 하루. 저장 데이터가 아니다
      required: [date, plannedCount, plannedDoneCount, doneTasks, movedTasks]
      properties:
        date: { $ref: "#/components/schemas/DateKey" }
        plannedCount: { type: integer, description: 그날이 수행 날짜였던 할 일 수 (나중에 옮긴 할 일 포함) }
        plannedDoneCount: { type: integer, description: 그중 그날 완료한 수 }
        doneTasks:
          type: array
          description: 그날 완료한 할 일 (날짜 없는 할 일을 완료한 것 포함)
          items: { $ref: "#/components/schemas/RecordTask" }
        movedTasks:
          type: array
          items: { $ref: "#/components/schemas/MovedTask" }
    WeekSummary:
      type: object
      additionalProperties: false
      required: [doneCount, activeDayCount, completionRate]
      properties:
        doneCount: { type: integer }
        activeDayCount: { type: integer }
        completionRate:
          type: [number, "null"]
          description: 계획 대비 실행률(0~1). 어제까지만 센다. 셀 날이 없으면 null
    DayRecordPage:
      type: object
      additionalProperties: false
      required: [days, olderBefore]
      properties:
        days:
          type: array
          description: 최근 날짜가 위. 계획도 완료도 없던 날은 빠진다
          items: { $ref: "#/components/schemas/DayRecord" }
        olderBefore:
          description: 더 이전 기록을 불러올 기준 날짜. 없으면 null
          oneOf: [{ $ref: "#/components/schemas/DateKey" }, { type: "null" }]
    RecordsOverview:
      type: object
      additionalProperties: false
      required: [week, days, olderBefore, earnedAchievementCount]
      properties:
        week: { $ref: "#/components/schemas/WeekSummary" }
        days:
          type: array
          items: { $ref: "#/components/schemas/DayRecord" }
        olderBefore:
          oneOf: [{ $ref: "#/components/schemas/DateKey" }, { type: "null" }]
        earnedAchievementCount: { type: integer }
    Achievement:
      type: object
      additionalProperties: false
      required: [code, name, description, target, unit]
      properties:
        code: { type: string, description: 업적 목록이 정해지기 전까지 string (docs/planning.md 14장) }
        name: { type: string }
        description: { type: string }
        target: { type: [integer, "null"] }
        unit: { type: [string, "null"] }
    AchievementProgress:
      type: object
      additionalProperties: false
      required: [achievement, earnedAt, progress]
      properties:
        achievement: { $ref: "#/components/schemas/Achievement" }
        earnedAt:
          oneOf: [{ $ref: "#/components/schemas/IsoDateTime" }, { type: "null" }]
        progress: { type: [integer, "null"] }

    # 마을, 집
    BuildingType:
      type: string
      enum: [OFFICE, SCHOOL, BANK, GYM, WORKSHOP]
    BuildingStage:
      type: string
      enum: [LOT, FRAME, COMPLETE]
    Building:
      type: object
      additionalProperties: false
      required: [id, goalId, type, stage, constructionProgress, lastSeenStage]
      properties:
        id: { type: string }
        goalId: { type: string }
        type: { $ref: "#/components/schemas/BuildingType" }
        stage: { $ref: "#/components/schemas/BuildingStage" }
        constructionProgress: { type: integer, description: 연결된 할 일 완료 수 }
        lastSeenStage: { $ref: "#/components/schemas/BuildingStage" }
    LedgerType:
      type: string
      enum: [EARN_CORE_TASK, EARN_DAILY_BONUS, EARN_ACHIEVEMENT, SPEND_FURNITURE, SPEND_HOUSE_UPGRADE, REVOKE_UNCOMPLETE]
    HouseLevel:
      type: string
      enum: [STUDIO, TWO_ROOM, APARTMENT, DETACHED]
    House:
      type: object
      additionalProperties: false
      required: [level]
      properties:
        level: { $ref: "#/components/schemas/HouseLevel" }
    Slot:
      type: object
      additionalProperties: false
      required: [id, slotType, x, y]
      properties:
        id: { type: string }
        slotType: { type: string, description: 슬롯 종류가 정해지기 전까지 string (docs/planning.md 14장) }
        x: { type: number, description: 방 그림 왼쪽 위 기준 % }
        y: { type: number }
    FurnitureCatalogItem:
      type: object
      additionalProperties: false
      required: [id, name, price, slotType]
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: integer }
        slotType: { type: string }
    Furniture:
      type: object
      additionalProperties: false
      required: [id, catalogItemId, purchasedAt]
      properties:
        id: { type: string }
        catalogItemId: { type: string }
        purchasedAt: { $ref: "#/components/schemas/IsoDateTime" }
    Placement:
      type: object
      additionalProperties: false
      required: [id, furnitureId, slotId]
      properties:
        id: { type: string }
        furnitureId: { type: string }
        slotId: { type: string }
    VillageDetail:
      type: object
      additionalProperties: false
      required: [house, buildings, goals, balance]
      properties:
        house: { $ref: "#/components/schemas/House" }
        buildings:
          type: array
          items: { $ref: "#/components/schemas/Building" }
        goals:
          type: array
          description: 건물에 연결된 목표 (보관한 목표 포함)
          items: { $ref: "#/components/schemas/Goal" }
        balance: { type: integer, description: 크레딧 잔액. 음수일 수 있다 }
    HouseDetail:
      type: object
      additionalProperties: false
      required: [house, slots, placements, furniture, catalog, balance]
      properties:
        house: { $ref: "#/components/schemas/House" }
        slots:
          type: array
          description: 지금 집 단계의 슬롯
          items: { $ref: "#/components/schemas/Slot" }
        placements:
          type: array
          items: { $ref: "#/components/schemas/Placement" }
        furniture:
          type: array
          items: { $ref: "#/components/schemas/Furniture" }
        catalog:
          type: array
          description: 판매 중인 가구
          items: { $ref: "#/components/schemas/FurnitureCatalogItem" }
        balance: { type: integer }
    PurchaseFurnitureRequest:
      type: object
      additionalProperties: false
      required: [catalogItemId, slotId]
      properties:
        catalogItemId: { type: string }
        slotId: { type: string }
    PlaceFurnitureRequest:
      type: object
      additionalProperties: false
      required: [furnitureId]
      properties:
        furnitureId: { type: string }

    # 설정
    ReminderSetting:
      type: object
      additionalProperties: false
      required: [enabled, time]
      properties:
        enabled: { type: boolean }
        time: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: "'HH:MM' 사용자 시간대 기준" }
    UserSettings:
      type: object
      additionalProperties: false
      required: [email, timezone, morningReminder, eveningReminder]
      properties:
        email: { type: string, format: email }
        timezone: { type: string, description: IANA 시간대. 예 Asia/Seoul }
        morningReminder: { $ref: "#/components/schemas/ReminderSetting" }
        eveningReminder: { $ref: "#/components/schemas/ReminderSetting" }
    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 보낸 값만 바꾼다
      properties:
        timezone: { type: string }
        morningReminder: { $ref: "#/components/schemas/ReminderSetting" }
        eveningReminder: { $ref: "#/components/schemas/ReminderSetting" }
    PushSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [endpoint, keys]
      description: 브라우저 PushSubscription.toJSON()의 값
      properties:
        endpoint: { type: string, format: uri }
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
